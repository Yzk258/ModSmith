# cargo的配置文件, 记录了项目的元信息和依赖项, 由cargo自动生成和管理, 不需要手动修改
[package]
name = "ModSmith"
version = "0.1.0"
edition = "2021"

[dependencies]
unicode-width = "0.2"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "sync"] }
tokio-stream = "0.1"
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
zip = "2"
chrono = "0.4"
sha1 = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
eframe = "0.29"
